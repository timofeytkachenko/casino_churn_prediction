[project]
name = "casino-churn-survival"
version = "0.1.0"
description = "60-day churn prediction for an online casino with XGBoost Cox and AFT survival models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "optuna>=5.1.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scikit-survival>=0.28.0",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
    "xgboost>=3.4.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "shap>=0.54.1",
]
